<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleShop - Test Results</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="results-container">

        <h1>StyleShop - Test Results</h1>

        <h2>Font</h2>
        <p>Font used: Arial, sans-serif</p>
        <img src="img/font.png" alt="CSS font-family example">

        <h2>HTML Validation</h2>
        <p>HTML validation results:</p>

        <h3>Home</h3>
        <img src="img/validator-index.png" alt="Home HTML validation results">

        <h3>Products</h3>
        <img src="img/validator.products.png" alt="Products HTML validation results">

        <h3>Contact</h3>
        <img src="img/validator-contact.png" alt="Contact HTML validation results">

        <h2>Lighthouse</h2>
        <p>Lighthouse test results:</p>

        <h3>Home</h3>
        <img src="img/lighthouse-index.png" alt="Home Lighthouse results">

        <h3>Products</h3>
        <img src="img/lighthouse-products.png" alt="Products Lighthouse results">

        <h3>Contact</h3>
        <img src="img/lighthouse-contact.png" alt="Contact Lighthouse results">

        <h2>Contrast</h2>
        <p>Accessibility contrast test results:</p>

        <h3>Home</h3>
        <img src="img/contrast.png" alt="Home contrast test results">

        <h3>Products</h3>
        <img src="img/contrast-products.png" alt="Products contrast check results">

        <h3>Contact</h3>
        <img src="img/contrast-contact.png" alt="Contact contrast check results">

    </main>

</body>
</html>
